<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"><title>Longship</title><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><span class="mark">ᛉ</span><div><b>LONGSHIP</b><small>YOUR WORLDS. YOUR WATCH.</small></div></div><span class="subtitle">Valheim dedicated server command center</span><div class="header-actions"><button id="tray" class="quiet" title="Minimize to system tray">Minimize to tray</button><button id="data" class="quiet">Open data folder ↗</button></div>
<div class="window-controls" role="group" aria-label="Window controls">
  <button id="windowMinimize" type="button" aria-label="Minimize window" title="Minimize"><span aria-hidden="true">−</span></button>
  <button id="windowMaximize" type="button" aria-label="Maximize window" title="Maximize"><span aria-hidden="true">□</span></button>
  <button id="windowClose" type="button" aria-label="Close window" title="Close"><span aria-hidden="true">×</span></button>
</div></header><div class="tabbar"><div id="tabs"></div><button id="add" class="add">＋ Add server</button></div><div id="message" role="status"></div><main id="app"></main><footer><span><i></i> Local server management · Windows &amp; Linux</span><span>Independent project · Not affiliated with Iron Gate</span><span id="clock"></span></footer>
<dialog id="modConfirm" aria-labelledby="modConfirmTitle" aria-describedby="modConfirmDetail">
  <form method="dialog">
    <h2 id="modConfirmTitle"></h2>
    <p id="modConfirmFile" class="mod-confirm-file"></p>
    <p id="modConfirmDetail"></p>
    <div class="actions">
      <button value="cancel" autofocus>Cancel</button>
      <button value="install" class="primary">Install package</button>
    </div>
  </form>
</dialog>
<script src="maintenance.js"></script><script src="backups.js"></script><script src="setup.js"></script><script src="app.js"></script><script src="window-controls.js"></script></body></html>
